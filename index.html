<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅遊購物清單</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif; background: #0f1117; color: #e4e4e7; }

/* ── Header ── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(135deg, #1e1e2e 0%, #2a2a3c 100%);
  color: white; padding: 12px 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  border-bottom: 1px solid #333348;
}
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.header h1 { font-size: 18px; letter-spacing: 0.5px; }
.user-badge {
  font-size: 13px; background: rgba(255,255,255,0.1);
  padding: 5px 12px; border-radius: 20px; cursor: pointer;
  transition: background 0.2s;
}
.user-badge:hover { background: rgba(255,255,255,0.18); }
.search-wrap { position: relative; }
.search-input {
  width: 100%; padding: 9px 12px 9px 36px;
  border: none; border-radius: 10px;
  background: rgba(255,255,255,0.08); color: #e4e4e7;
  font-size: 14px; outline: none; transition: background 0.2s;
}
.search-input:focus { background: rgba(255,255,255,0.14); }
.search-input::placeholder { color: rgba(255,255,255,0.35); }
.search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; }

/* ── Sort bar ── */
.sort-bar {
  background: #1a1a2e; padding: 10px 12px;
  display: flex; gap: 7px; overflow-x: auto;
  border-bottom: 1px solid #2a2a3c; scrollbar-width: none;
}
.sort-bar::-webkit-scrollbar { display: none; }
.sort-btn {
  white-space: nowrap; padding: 6px 15px;
  border-radius: 20px; border: 1.5px solid #3a3a50;
  background: #1a1a2e; color: #a1a1b5; font-size: 13px; cursor: pointer;
  transition: all 0.2s; font-weight: 500;
}
.sort-btn.active { background: #6366f1; color: white; border-color: #6366f1; }

/* ── Filter bar ── */
.filter-bar {
  background: #1a1a2e; padding: 8px 12px;
  display: flex; gap: 8px; align-items: center;
  border-bottom: 1px solid #2a2a3c; flex-wrap: wrap;
}
.filter-chip {
  padding: 5px 13px; border-radius: 20px;
  border: 1.5px solid #3a3a50; background: #1a1a2e; color: #a1a1b5;
  font-size: 12px; cursor: pointer; transition: all 0.2s; font-weight: 500;
}
.filter-chip.active { background: #ef4444; color: white; border-color: #ef4444; }
.filter-select {
  padding: 5px 10px; border-radius: 20px;
  border: 1.5px solid #3a3a50; background: #1a1a2e; color: #a1a1b5;
  font-size: 12px; cursor: pointer; outline: none;
}

/* ── Stats ── */
.stats-bar {
  background: #151522; padding: 6px 16px;
  font-size: 12px; color: #71717a;
  border-bottom: 1px solid #2a2a3c;
  display: flex; gap: 12px;
}
.stats-bar span { display: flex; align-items: center; gap: 4px; }
.stat-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.stat-dot.green { background: #22c55e; }
.stat-dot.orange { background: #f59e0b; }

/* ── Main ── */
.main { padding: 12px; padding-bottom: 80px; }
.group-header {
  font-size: 12px; font-weight: 700; color: #a78bfa;
  padding: 10px 4px 6px; letter-spacing: 1px;
  text-transform: uppercase;
  border-bottom: 2px solid #6366f1;
  margin-bottom: 10px; margin-top: 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.group-header:first-child { margin-top: 0; }
.group-count {
  font-size: 11px; background: #6366f1; color: white;
  padding: 1px 8px; border-radius: 10px; letter-spacing: 0;
}

/* ── Card grid ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
  gap: 10px; margin-bottom: 4px;
}

/* ── Item card ── */
.item-card {
  background: #1e1e2e; border-radius: 14px; overflow: hidden;
  box-shadow: 0 1px 5px rgba(0,0,0,0.3);
  position: relative; transition: transform 0.2s, box-shadow 0.2s;
  border: 1px solid #2a2a3c;
}
.item-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
.item-card.purchased { opacity: 0.55; }

.card-img-wrap {
  width: 100%; aspect-ratio: 1;
  background: linear-gradient(135deg, #252538 0%, #1e1e2e 100%);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.card-img-placeholder { font-size: 44px; }

.card-body { padding: 9px 10px; }
.card-name-zh { font-size: 13px; font-weight: 700; color: #f0f0f5; margin-bottom: 2px; line-height: 1.35; }
.card-name-ja { font-size: 10px; color: #6b6b80; margin-bottom: 7px; line-height: 1.4; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; }
.tag {
  font-size: 10px; padding: 2px 7px; border-radius: 9px;
  background: rgba(99,102,241,0.15); color: #a5b4fc; font-weight: 500;
}
.tag.cat { background: rgba(251,146,60,0.15); color: #fdba74; }
.tag.req { background: rgba(34,197,94,0.15); color: #86efac; }
.tag.loc { background: rgba(167,139,250,0.15); color: #c4b5fd; }

.card-footer { display: flex; gap: 5px; }
.btn-status {
  flex: 1; padding: 6px 0; border: none; border-radius: 7px;
  font-size: 11px; cursor: pointer; font-weight: 700;
  transition: all 0.2s;
}
.btn-status.is-purchased { background: rgba(34,197,94,0.2); color: #4ade80; }
.btn-status.not-purchased { background: rgba(245,158,11,0.2); color: #fbbf24; }
.btn-icon {
  padding: 6px 8px; border: 1.5px solid #3a3a50; border-radius: 7px;
  background: #1e1e2e; color: #a1a1b5; font-size: 12px; cursor: pointer; transition: background 0.2s;
}
.btn-icon:hover { background: #2a2a3c; }
.btn-icon.del { border-color: rgba(239,68,68,0.3); color: #f87171; }
.btn-icon.del:hover { background: rgba(239,68,68,0.15); }

.purchased-badge {
  position: absolute; top: 8px; left: 8px;
  background: #22c55e; color: #052e16; font-size: 10px;
  padding: 2px 8px; border-radius: 10px; font-weight: 700;
}

/* ── FAB ── */
.fab {
  position: fixed; bottom: 24px; right: 20px;
  width: 58px; height: 58px; border-radius: 50%;
  background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
  color: white; border: none; font-size: 30px;
  cursor: pointer; box-shadow: 0 4px 16px rgba(99,102,241,0.5);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s, box-shadow 0.2s; z-index: 500;
}
.fab:hover { transform: scale(1.1); box-shadow: 0 6px 22px rgba(99,102,241,0.6); }

/* ── Modal overlay ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: #1e1e2e; border-radius: 22px 22px 0 0;
  width: 100%; max-width: 600px; max-height: 92vh;
  overflow-y: auto; padding: 22px 20px 32px;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  border-top: 1px solid #333348;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-handle {
  width: 40px; height: 4px; background: #3a3a50;
  border-radius: 4px; margin: 0 auto 18px;
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modal-title { font-size: 18px; font-weight: 800; color: #f0f0f5; }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%;
  background: #2a2a3c; border: none; cursor: pointer; color: #a1a1b5;
  font-size: 16px; display: flex; align-items: center; justify-content: center;
}

/* ── Form ── */
.form-group { margin-bottom: 18px; }
.form-label { font-size: 12px; font-weight: 700; color: #71717a; margin-bottom: 6px; display: block; letter-spacing: 0.5px; }
.form-input, .form-select {
  width: 100%; padding: 11px 13px;
  border: 1.5px solid #3a3a50; border-radius: 10px;
  font-size: 14px; outline: none; transition: border-color 0.2s;
  font-family: inherit; background: #151522; color: #e4e4e7;
}
.form-input:focus, .form-select:focus { border-color: #6366f1; }
.form-select option { background: #1e1e2e; color: #e4e4e7; }

.photo-area {
  border: 2px dashed #3a3a50; border-radius: 12px;
  padding: 22px 16px; text-align: center; cursor: pointer;
  transition: border-color 0.2s, background 0.2s; position: relative;
}
.photo-area:hover { border-color: #6366f1; background: #151522; }
.photo-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.photo-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; display: none; }
.photo-placeholder-icon { font-size: 36px; margin-bottom: 6px; }
.photo-hint { font-size: 12px; color: #6b6b80; }

.status-row { display: flex; gap: 10px; }
.status-opt {
  flex: 1; padding: 11px; border: 2px solid #3a3a50;
  border-radius: 10px; text-align: center; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: all 0.2s; color: #a1a1b5;
}
.status-opt.sel-purchased { border-color: #22c55e; background: rgba(34,197,94,0.1); color: #4ade80; }
.status-opt.sel-unpurchased { border-color: #f59e0b; background: rgba(245,158,11,0.1); color: #fbbf24; }

.btn-save {
  width: 100%; padding: 15px; background: #6366f1; color: white;
  border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
  cursor: pointer; margin-top: 6px; transition: background 0.2s;
}
.btn-save:hover { background: #4f46e5; }

/* ── Name setup banner ── */
.setup-banner {
  background: linear-gradient(135deg, #312e81 0%, #3730a3 100%);
  padding: 16px; text-align: center;
  border-bottom: 2px solid #6366f1;
}
.setup-banner.hidden { display: none; }
.setup-banner p { font-size: 14px; font-weight: 600; color: #c7d2fe; margin-bottom: 10px; }
.setup-row { display: flex; gap: 8px; max-width: 360px; margin: 0 auto; }
.setup-input {
  flex: 1; padding: 10px 14px; border: 2px solid #6366f1;
  border-radius: 10px; font-size: 15px; text-align: center;
  outline: none; font-family: inherit; background: #1e1e2e; color: #e4e4e7;
}
.setup-input:focus { border-color: #a78bfa; }
.setup-btn {
  padding: 10px 20px; background: #6366f1; color: white;
  border: none; border-radius: 10px; font-size: 15px;
  cursor: pointer; font-weight: 700; white-space: nowrap;
}

/* ── Empty state ── */
.empty-state { text-align: center; padding: 70px 20px; }
.empty-icon { font-size: 64px; margin-bottom: 16px; }
.empty-text { font-size: 15px; color: #71717a; line-height: 1.7; }

/* ── Settings modal ── */
.settings-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 600; opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.settings-overlay.open { opacity: 1; pointer-events: all; }
.settings-panel {
  background: #1e1e2e; border-radius: 22px 22px 0 0;
  width: 100%; max-width: 600px; max-height: 92vh;
  overflow-y: auto; padding: 22px 20px 32px;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  border-top: 1px solid #333348;
}
.settings-overlay.open .settings-panel { transform: translateY(0); }

.opt-section { margin-bottom: 22px; }
.opt-section-title {
  font-size: 13px; font-weight: 700; color: #a78bfa;
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.opt-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.opt-chip {
  display: flex; align-items: center; gap: 4px;
  padding: 5px 8px 5px 12px; border-radius: 20px;
  background: #252538; color: #c4c4d4; font-size: 13px; border: 1.5px solid #3a3a50;
}
.opt-chip-del {
  width: 18px; height: 18px; border-radius: 50%;
  background: rgba(239,68,68,0.2); border: none; color: #f87171;
  font-size: 12px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; line-height: 1;
}
.opt-chip-del:hover { background: #ef4444; color: white; }
.opt-add-row { display: flex; gap: 6px; }
.opt-add-input {
  flex: 1; padding: 7px 12px; border: 1.5px solid #3a3a50;
  border-radius: 8px; font-size: 13px; outline: none; font-family: inherit;
  background: #151522; color: #e4e4e7;
}
.opt-add-input:focus { border-color: #6366f1; }
.opt-add-btn {
  padding: 7px 14px; background: #6366f1; color: white;
  border: none; border-radius: 8px; font-size: 13px;
  cursor: pointer; font-weight: 600; white-space: nowrap;
}
.settings-gear {
  font-size: 13px; background: rgba(255,255,255,0.1);
  padding: 5px 10px; border-radius: 20px; cursor: pointer;
  transition: background 0.2s; border: none; color: white;
}
.settings-gear:hover { background: rgba(255,255,255,0.18); }

/* ── Connection status ── */
.conn-status {
  position: fixed; bottom: 90px; right: 20px;
  font-size: 11px; padding: 5px 12px; border-radius: 20px;
  z-index: 500; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  transition: opacity 0.3s;
}
.conn-status.ok { background: rgba(34,197,94,0.2); color: #4ade80; }
.conn-status.err { background: rgba(239,68,68,0.2); color: #f87171; }
.conn-status.connecting { background: rgba(245,158,11,0.2); color: #fbbf24; }

/* ── Detail modal ── */
.detail-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 350; opacity: 0; pointer-events: none; transition: opacity 0.25s;
  padding: 16px;
}
.detail-overlay.open { opacity: 1; pointer-events: all; }
.detail-card {
  background: #1e1e2e; border-radius: 18px; width: 100%; max-width: 420px;
  max-height: 90vh; overflow-y: auto; border: 1px solid #333348;
  transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.detail-overlay.open .detail-card { transform: scale(1); }
.detail-img-wrap {
  width: 100%; aspect-ratio: 1; background: linear-gradient(135deg, #252538 0%, #1e1e2e 100%);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  border-radius: 18px 18px 0 0; position: relative;
}
.detail-img-wrap img { width: 100%; height: 100%; object-fit: contain; background: #151522; }
.detail-img-placeholder { font-size: 80px; }
.detail-close {
  position: absolute; top: 12px; right: 12px;
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(0,0,0,0.6); border: none; color: white;
  font-size: 18px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.detail-body { padding: 16px 18px 20px; }
.detail-name-zh { font-size: 20px; font-weight: 800; color: #f0f0f5; margin-bottom: 4px; }
.detail-name-ja { font-size: 13px; color: #6b6b80; margin-bottom: 14px; }
.detail-info { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.detail-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 14px; color: #c4c4d4;
}
.detail-row-icon { width: 28px; text-align: center; font-size: 16px; flex-shrink: 0; }
.detail-row-label { color: #71717a; font-size: 12px; min-width: 55px; }
.detail-actions { display: flex; gap: 8px; }
.detail-btn {
  flex: 1; padding: 11px; border: none; border-radius: 10px;
  font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s;
}
.detail-btn.status-bought { background: rgba(34,197,94,0.2); color: #4ade80; }
.detail-btn.status-unbought { background: rgba(245,158,11,0.2); color: #fbbf24; }
.detail-btn.edit-btn { background: #2a2a3c; color: #a1a1b5; }
.detail-btn.del-btn { background: rgba(239,68,68,0.15); color: #f87171; }

@keyframes flash {
  0%, 100% { background: linear-gradient(135deg, #312e81 0%, #3730a3 100%); }
  50% { background: linear-gradient(135deg, #3730a3 0%, #4f46e5 100%); }
}

@media (min-width: 480px) {
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); }
}
</style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
  <div class="header-top">
    <h1>✈️ 旅遊購物清單</h1>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="settings-gear" onclick="openSettings()" title="管理選單選項">⚙️</button>
      <div class="user-badge" onclick="promptChangeName()" title="點擊更改名字">
        👤 <span id="userLabel">載入中</span>
      </div>
    </div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" type="text"
      placeholder="搜尋商品（中文 / 日文名稱）…" oninput="render()">
  </div>
</div>

<!-- ── Name setup banner ── -->
<div class="setup-banner" id="setupBanner">
  <p>✈️ 請先輸入您的名字，方便記錄需求</p>
  <div class="setup-row">
    <input class="setup-input" type="text" id="nameInput" placeholder="您的名字" maxlength="20">
    <button class="setup-btn" onclick="confirmName()">確認</button>
  </div>
</div>

<!-- ── Sort bar ── -->
<div class="sort-bar">
  <button class="sort-btn active" data-sort="all"       onclick="setSort('all')">全部</button>
  <button class="sort-btn"        data-sort="location"  onclick="setSort('location')">📍 按地點</button>
  <button class="sort-btn"        data-sort="category"  onclick="setSort('category')">🏷️ 按性質</button>
  <button class="sort-btn"        data-sort="requester" onclick="setSort('requester')">👤 按需求者</button>
  <button class="sort-btn"        data-sort="mine"      onclick="setSort('mine')">⭐ 我的清單</button>
</div>

<!-- ── Filter bar ── -->
<div class="filter-bar">
  <button class="filter-chip" id="chipUnpurchased" onclick="toggleUnpurchased()">⬜ 僅顯示未購買</button>
  <select class="filter-select" id="selLocation" onchange="render()" style="display:none">
    <option value="">📍 所有地點</option>
  </select>
  <select class="filter-select" id="selCategory" onchange="render()" style="display:none">
    <option value="">🏷️ 所有性質</option>
  </select>
  <select class="filter-select" id="selRequester" onchange="render()" style="display:none">
    <option value="">👤 所有需求者</option>
  </select>
</div>

<!-- ── Stats ── -->
<div class="stats-bar" id="statsBar"></div>

<!-- ── Main ── -->
<div class="main" id="main"></div>

<!-- ── Detail modal ── -->
<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-card">
    <div class="detail-img-wrap">
      <img id="detailImg" style="display:none" alt="">
      <div id="detailImgPlaceholder" class="detail-img-placeholder"></div>
      <button class="detail-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-body">
      <div class="detail-name-zh" id="detailNameZh"></div>
      <div class="detail-name-ja" id="detailNameJa"></div>
      <div class="detail-info">
        <div class="detail-row" id="detailLocation"><span class="detail-row-icon">📍</span><span class="detail-row-label">地點</span><span id="detailLocVal"></span></div>
        <div class="detail-row" id="detailCategory"><span class="detail-row-icon">🏷️</span><span class="detail-row-label">性質</span><span id="detailCatVal"></span></div>
        <div class="detail-row" id="detailRequester"><span class="detail-row-icon">👤</span><span class="detail-row-label">需求者</span><span id="detailReqVal"></span></div>
        <div class="detail-row"><span class="detail-row-icon">📋</span><span class="detail-row-label">狀態</span><span id="detailStatusVal"></span></div>
      </div>
      <div class="detail-actions">
        <button class="detail-btn status-unbought" id="detailToggleBtn" onclick="detailToggleBought()"></button>
        <button class="detail-btn edit-btn" onclick="detailEdit()">✏️ 編輯</button>
        <button class="detail-btn del-btn" onclick="detailDelete()">🗑️ 刪除</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Connection status ── -->
<div class="conn-status connecting" id="connStatus">⏳ 連線中…</div>

<!-- ── FAB ── -->
<button class="fab" onclick="openAddModal()" title="新增項目">＋</button>

<!-- ── Add / Edit Modal ── -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">新增購物項目</div>

    <!-- Chinese name -->

    <!-- Category -->
    <div class="form-group">
      <label class="form-label">項目性質</label>

    <div class="form-group">
      <label class="form-label">需求者</label>
      <select class="form-select" id="fRequester"></select>

    <!-- Status -->
    <div class="form-group">
      <label class="form-label">購買狀態</label>
      <div class="status-row">

        <div class="status-opt"                 id="optPurchased"   onclick="setFormStatus(true)">✅ 已購買</div>
      </div>

    <button class="btn-save" onclick="saveItem()">💾 儲存</button>

</div>

<!-- ── Settings Modal ── -->
<div class="settings-overlay" id="settingsOverlay" onclick="if(event.target===this)closeSettings()">
  <div class="settings-panel">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">⚙️ 管理選單選項</div>
      <button class="modal-close" onclick="closeSettings()">✕</button>
    </div>

    <!-- Locations -->
    <div class="opt-section">
      <div class="opt-section-title">📍 購買地點</div>
      <div class="opt-list" id="optListLocation"></div>
      <div class="opt-add-row">
        <input class="opt-add-input" id="optInputLocation" placeholder="新增地點…"
          onkeydown="if(event.key==='Enter')addOption('locations')">
        <button class="opt-add-btn" onclick="addOption('locations')">新增</button>
      </div>
    </div>

    <!-- Categories -->
    <div class="opt-section">
      <div class="opt-section-title">🏷️ 項目性質</div>
      <div class="opt-list" id="optListCategory"></div>
      <div class="opt-add-row">
        <input class="opt-add-input" id="optInputCategory" placeholder="新增分類…"
          onkeydown="if(event.key==='Enter')addOption('categories')">
        <button class="opt-add-btn" onclick="addOption('categories')">新增</button>
      </div>
    </div>

    <!-- Requesters -->
    <div class="opt-section">
      <div class="opt-section-title">👤 需求者</div>
      <div class="opt-list" id="optListRequester"></div>
      <div class="opt-add-row">
        <input class="opt-add-input" id="optInputRequester" placeholder="新增成員…"
          onkeydown="if(event.key==='Enter')addOption('requesters')">
        <button class="opt-add-btn" onclick="addOption('requesters')">新增</button>
      </div>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
// ══════════════════════════════════════
//  ★ Firebase 設定 — 請填入你的 Firebase 專案資訊 ★
// ══════════════════════════════════════
const firebaseConfig = {
  apiKey:            "AIzaSyCJRIqX4hOK61DZA0dXgTNY20oWgOY8Xso",
  authDomain:        "travel-shopping.firebaseapp.com",
  projectId:         "travel-shopping",
  storageBucket:     "travel-shopping.firebasestorage.app",
  messagingSenderId: "857496641318",
  appId:             "1:857496641318:web:afb1db0feccfacb3ff2be7"
};
// ══════════════════════════════════════

// Init Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 啟用離線快取（刷新頁面也能保留資料）
db.enablePersistence({ synchronizeTabs: true }).catch(err => {
  console.warn('Firestore persistence error:', err.code);
});

// ══════════════════════════════════════
//  State
// ══════════════════════════════════════
let items        = [];
let currentUser  = localStorage.getItem('travel_user') || '';
let sortMode     = 'all';
let onlyUnsold   = false;
let editingId    = null;
let formPhoto    = null;
let formBought   = false;

const DEFAULT_OPTIONS = {
  locations:  ['松本清','唐吉訶德','成田機場','羽田機場','藥妝店','便利商店','百貨公司','超市'],
  categories: ['藥妝','零食','伴手禮','電器','服飾','保養品','文具'],
  requesters: []
};
let dropdownOptions = JSON.parse(JSON.stringify(DEFAULT_OPTIONS));

// ══════════════════════════════════════
//  Boot — 啟動即時監聽
// ══════════════════════════════════════
function boot() {
  if (!currentUser) {
    document.getElementById('setupBanner').classList.remove('hidden');
    document.getElementById('userLabel').textContent = '未設定';
  } else {
    document.getElementById('setupBanner').classList.add('hidden');
    document.getElementById('userLabel').textContent = currentUser;
  }

  const statusEl = document.getElementById('connStatus');

  // 即時監聽購物項目
  db.collection('items').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
    items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    statusEl.textContent = '✅ 已連線（' + items.length + ' 項）';
    statusEl.className = 'conn-status ok';
    setTimeout(() => { statusEl.style.opacity = '0'; }, 3000);
    refreshGroupFilters();
    render();
  }, err => {
    console.error('Firestore items error:', err.code, err.message);
    statusEl.textContent = '❌ 連線失敗：' + err.code;
    statusEl.className = 'conn-status err';
    statusEl.style.opacity = '1';
  });

  // 即時監聽選單選項
  db.doc('settings/options').onSnapshot(doc => {
    if (doc.exists) {
      dropdownOptions = doc.data();
    } else {
      db.doc('settings/options').set(DEFAULT_OPTIONS);
      dropdownOptions = JSON.parse(JSON.stringify(DEFAULT_OPTIONS));
    }
    populateFormDropdowns();
    if (document.getElementById('settingsOverlay').classList.contains('open')) {
      renderOptionLists();
    }
  }, err => {
    console.error('Firestore options error:', err.code, err.message);
  });

  populateFormDropdowns();
  render();
}

// ══════════════════════════════════════
//  User name (localStorage — 各裝置獨立)
// ══════════════════════════════════════
function confirmName() {
  const v = document.getElementById('nameInput').value.trim();
  if (!v) { document.getElementById('nameInput').focus(); return; }
  currentUser = v;
  localStorage.setItem('travel_user', v);
  document.getElementById('userLabel').textContent = v;
  document.getElementById('setupBanner').classList.add('hidden');
  render();
}

function promptChangeName() {
  const v = prompt('更改您的名字：', currentUser);
  if (v && v.trim()) {
    currentUser = v.trim();
    localStorage.setItem('travel_user', currentUser);
    document.getElementById('userLabel').textContent = currentUser;
    render();
  }
}

document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmName();
});

// ══════════════════════════════════════
//  Sort & Filter
// ══════════════════════════════════════
function setSort(mode) {
  sortMode = mode;
  document.querySelectorAll('.sort-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.sort === mode)
  );
  document.getElementById('selLocation').style.display  = (mode === 'location')  ? '' : 'none';
  document.getElementById('selCategory').style.display  = (mode === 'category')  ? '' : 'none';
  document.getElementById('selRequester').style.display = (mode === 'requester') ? '' : 'none';
  refreshGroupFilters();
  render();
}

function toggleUnpurchased() {
  onlyUnsold = !onlyUnsold;
  document.getElementById('chipUnpurchased').classList.toggle('active', onlyUnsold);
  render();
}

function refreshGroupFilters() {
  populateFilterSelect('selLocation',  'location',  '📍 所有地點');
  populateFilterSelect('selCategory',  'category',  '🏷️ 所有性質');
  populateFilterSelect('selRequester', 'requester', '👤 所有需求者');
}

function populateFilterSelect(selId, field, allLabel) {
  const sel  = document.getElementById(selId);
  const prev = sel.value;
  const vals = [...new Set(items.map(i => i[field]).filter(Boolean))].sort(
    (a, b) => a.localeCompare(b, 'zh')
  );
  sel.innerHTML = `<option value="">${allLabel}</option>`;
  vals.forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    if (v === prev) o.selected = true;
    sel.appendChild(o);
  });
}

function filteredItems() {
  const q      = document.getElementById('searchInput').value.toLowerCase();
  const locFil = document.getElementById('selLocation').value;
  const catFil = document.getElementById('selCategory').value;
  const reqFil = document.getElementById('selRequester').value;
  return items.filter(it => {
    if (onlyUnsold && it.purchased)                         return false;
    if (locFil && it.location !== locFil)                   return false;
    if (catFil && it.category !== catFil)                   return false;
    if (reqFil && it.requester !== reqFil)                  return false;
    if (sortMode === 'mine' && it.requester !== currentUser) return false;
    if (q) {
      const hit = (it.nameZh || '').toLowerCase().includes(q)
               || (it.nameJa || '').toLowerCase().includes(q);
      if (!hit) return false;
    }
    return true;
  });
}

// ══════════════════════════════════════
//  Render
// ══════════════════════════════════════
function render() {
  const list  = filteredItems();
  const total = items.length;
  const done  = items.filter(i => i.purchased).length;

  document.getElementById('statsBar').innerHTML =
    `<span><span class="stat-dot green"></span>已購買 ${done}</span>
     <span><span class="stat-dot orange"></span>未購買 ${total - done}</span>
     <span>共 ${total} 項</span>`;

  const main = document.getElementById('main');

  if (list.length === 0) {
    main.innerHTML = `<div class="empty-state">
      <div class="empty-icon">${total === 0 ? '🛒' : '🔍'}</div>
      <div class="empty-text">${total === 0
        ? '清單是空的<br>點右下角「＋」新增第一項！'
        : '找不到符合條件的商品'}</div>
    </div>`;
    return;
  }

  if (sortMode === 'all' || sortMode === 'mine') {
    main.innerHTML = `<div class="card-grid">${list.map(cardHTML).join('')}</div>`;
    return;
  }

  const key = { location: 'location', category: 'category', requester: 'requester' }[sortMode];
  const icon = { location: '📍', category: '🏷️', requester: '👤' }[sortMode];
  const groups = {};
  list.forEach(it => {
    const g = it[key] || '未分類';
    (groups[g] = groups[g] || []).push(it);
  });

  main.innerHTML = Object.entries(groups)
    .sort(([a], [b]) => a.localeCompare(b, 'zh'))
    .map(([g, gItems]) => `
      <div class="group-header">
        <span>${icon} ${esc(g)}</span>
        <span class="group-count">${gItems.length} 項</span>
      </div>
      <div class="card-grid">${gItems.map(cardHTML).join('')}</div>
    `).join('');
}

function cardHTML(it) {
  const img = it.photo
    ? `<img src="${it.photo}" alt="${esc(it.nameZh)}" onerror="this.style.display='none'">`
    : `<div class="card-img-placeholder">${catEmoji(it.category)}</div>`;

  return `
    <div class="item-card${it.purchased ? ' purchased' : ''}" id="card-${it.id}">
      ${it.purchased ? '<div class="purchased-badge">✓ 已購買</div>' : ''}
      <div class="card-img-wrap" onclick="openDetail('${it.id}')" style="cursor:pointer">${img}</div>
      <div class="card-body">
        <div class="card-name-zh" onclick="openDetail('${it.id}')" style="cursor:pointer">${esc(it.nameZh)}</div>
        ${it.nameJa ? `<div class="card-name-ja" onclick="openDetail('${it.id}')" style="cursor:pointer">${esc(it.nameJa)}</div>` : ''}
        <div class="card-tags">
          ${it.location  ? `<span class="tag loc">📍 ${esc(it.location)}</span>`  : ''}
          ${it.category  ? `<span class="tag cat">🏷️ ${esc(it.category)}</span>`  : ''}
          ${it.requester ? `<span class="tag req">👤 ${esc(it.requester)}</span>` : ''}
        </div>
        <div class="card-footer">
          <button class="btn-status ${it.purchased ? 'is-purchased' : 'not-purchased'}"
            onclick="toggleBought('${it.id}')">
            ${it.purchased ? '✅ 已購買' : '⬜ 標記購買'}
          </button>
          <button class="btn-icon" onclick="startEdit('${it.id}')" title="編輯">✏️</button>
          <button class="btn-icon del" onclick="removeItem('${it.id}')" title="刪除">🗑️</button>
        </div>
      </div>
    </div>`;
}

function catEmoji(cat) {
  return { '藥妝':'💊','零食':'🍬','伴手禮':'🎁','電器':'⚡','服飾':'👗',
           '保養品':'🧴','文具':'✏️' }[cat] || '🛍️';
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
                .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════════
//  CRUD → Firestore
// ══════════════════════════════════════
function showConnStatus(msg, type) {
  const el = document.getElementById('connStatus');
  el.textContent = msg;
  el.className = 'conn-status ' + type;
  el.style.opacity = '1';
  if (type === 'ok') setTimeout(() => { el.style.opacity = '0'; }, 3000);
}

function toggleBought(id) {
  const it = items.find(i => i.id === id);
  if (it) {
    db.collection('items').doc(id).update({ purchased: !it.purchased })
      .catch(e => { alert('操作失敗：' + e.message); showConnStatus('❌ ' + e.code, 'err'); });
  }
}

function removeItem(id) {
  if (!confirm('確定刪除這個項目嗎？')) return;
  db.collection('items').doc(id).delete()
    .catch(e => { alert('刪除失敗：' + e.message); showConnStatus('❌ ' + e.code, 'err'); });
}

function saveItem() {
  const nameZh = document.getElementById('fNameZh').value.trim();
  if (!nameZh) { alert('請填寫中文名稱！'); document.getElementById('fNameZh').focus(); return; }

  const data = {
    nameZh,
    nameJa:     document.getElementById('fNameJa').value.trim(),
    location:   document.getElementById('fLocation').value,
    category:   document.getElementById('fCategory').value,
    requester:  document.getElementById('fRequester').value || currentUser,
    purchased:  formBought,
    photo:      formPhoto || null,
  };

  let op;
  if (editingId) {
    op = db.collection('items').doc(editingId).update(data);
  } else {
    data.createdAt = new Date().toISOString();
    op = db.collection('items').add(data);
  }

  op.then(() => {
    showConnStatus('✅ 已儲存', 'ok');
  }).catch(e => {
    alert('儲存失敗：' + e.message);
    showConnStatus('❌ ' + e.code, 'err');
  });

  closeModal();
}

// ══════════════════════════════════════
//  Modal helpers
// ══════════════════════════════════════
function openAddModal() {
  if (!currentUser) {
    document.getElementById('nameInput').focus();
    document.getElementById('setupBanner').style.animation = 'flash 0.5s';
    setTimeout(() => document.getElementById('setupBanner').style.animation = '', 600);
    return;
  }
  editingId  = null;
  formPhoto  = null;
  formBought = false;
  document.getElementById('modalTitle').textContent = '新增購物項目';
  document.getElementById('fNameZh').value    = '';
  document.getElementById('fNameJa').value    = '';
  document.getElementById('fLocation').value  = '';
  document.getElementById('fCategory').value  = '';
  document.getElementById('fRequester').value = '';
  document.getElementById('photoPreview').style.display  = 'none';
  document.getElementById('photoPlaceholder').style.display = 'block';
  document.getElementById('photoInput').value = '';
  setFormStatus(false);
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('fNameZh').focus(), 350);
}

function startEdit(id) {
  const it = items.find(i => i.id === id);
  if (!it) return;
  editingId  = id;
  formPhoto  = it.photo || null;
  formBought = it.purchased || false;

  document.getElementById('modalTitle').textContent    = '編輯購物項目';
  document.getElementById('fNameZh').value    = it.nameZh    || '';
  document.getElementById('fNameJa').value    = it.nameJa    || '';
  document.getElementById('fLocation').value  = it.location  || '';
  document.getElementById('fCategory').value  = it.category  || '';
  document.getElementById('fRequester').value = it.requester || '';

  if (it.photo) {
    document.getElementById('photoPreview').src            = it.photo;
    document.getElementById('photoPreview').style.display  = 'block';
    document.getElementById('photoPlaceholder').style.display = 'none';
  } else {
    document.getElementById('photoPreview').style.display  = 'none';
    document.getElementById('photoPlaceholder').style.display = 'block';
  }
  document.getElementById('photoInput').value = '';
  setFormStatus(it.purchased);
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

// ══════════════════════════════════════
//  Photo upload (壓縮至 600px，減少 Firestore 用量)
// ══════════════════════════════════════
function onPhotoChange(e) {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    const MAX = 600;
    let w = img.width, h = img.height;
    if (w > MAX || h > MAX) {
      if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
      else        { w = Math.round(w * MAX / h); h = MAX; }
    }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    formPhoto = canvas.toDataURL('image/jpeg', 0.6);
    URL.revokeObjectURL(url);
    document.getElementById('photoPreview').src            = formPhoto;
    document.getElementById('photoPreview').style.display  = 'block';
    document.getElementById('photoPlaceholder').style.display = 'none';
  };
  img.src = url;
}

// ══════════════════════════════════════
//  Status toggle
// ══════════════════════════════════════
function setFormStatus(bought) {
  formBought = bought;
  document.getElementById('optPurchased').className   = 'status-opt' + (bought  ? ' sel-purchased'   : '');
  document.getElementById('optUnpurchased').className = 'status-opt' + (!bought ? ' sel-unpurchased' : '');
}

// ══════════════════════════════════════
//  Settings & Dropdown Options → Firestore
// ══════════════════════════════════════
function openSettings() {
  renderOptionLists();
  document.getElementById('settingsOverlay').classList.add('open');
}
function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('open');
}

function renderOptionLists() {
  const map = {
    locations:  'optListLocation',
    categories: 'optListCategory',
    requesters: 'optListRequester'
  };
  for (const [key, elId] of Object.entries(map)) {
    const el = document.getElementById(elId);
    el.innerHTML = (dropdownOptions[key] || []).map((v, i) =>
      `<div class="opt-chip">${esc(v)}<button class="opt-chip-del" onclick="removeOption('${key}',${i})" title="刪除">✕</button></div>`
    ).join('') || '<span style="font-size:12px;color:#9ca3af">尚未新增</span>';
  }
}

function addOption(key) {
  const inputMap = { locations: 'optInputLocation', categories: 'optInputCategory', requesters: 'optInputRequester' };
  const input = document.getElementById(inputMap[key]);
  const v = input.value.trim();
  if (!v) return;
  if ((dropdownOptions[key] || []).includes(v)) { input.value = ''; return; }
  dropdownOptions[key] = [...(dropdownOptions[key] || []), v];
  db.doc('settings/options').set(dropdownOptions);
  input.value = '';
  renderOptionLists();
  populateFormDropdowns();
}

function removeOption(key, idx) {
  dropdownOptions[key].splice(idx, 1);
  db.doc('settings/options').set(dropdownOptions);
  renderOptionLists();
  populateFormDropdowns();
}

function populateFormDropdowns() {
  const locSel = document.getElementById('fLocation');
  const catSel = document.getElementById('fCategory');
  const reqSel = document.getElementById('fRequester');

  const prevLoc = locSel.value;
  const prevCat = catSel.value;
  const prevReq = reqSel.value;

  locSel.innerHTML = '<option value="">請選擇地點（選填）</option>'
    + (dropdownOptions.locations || []).map(v => `<option>${esc(v)}</option>`).join('');

  catSel.innerHTML = '<option value="">請選擇性質（選填）</option>'
    + (dropdownOptions.categories || []).map(v => `<option>${esc(v)}</option>`).join('');

  reqSel.innerHTML = '<option value="">預設為自己</option>'
    + (dropdownOptions.requesters || []).map(v => `<option>${esc(v)}</option>`).join('');

  locSel.value = prevLoc;
  catSel.value = prevCat;
  reqSel.value = prevReq;
}

// ══════════════════════════════════════
//  Detail view (放大檢視)
// ══════════════════════════════════════
let detailItemId = null;

function openDetail(id) {
  const it = items.find(i => i.id === id);
  if (!it) return;
  detailItemId = id;

  // Photo
  const imgEl = document.getElementById('detailImg');
  const phEl  = document.getElementById('detailImgPlaceholder');
  if (it.photo) {
    imgEl.src = it.photo;
    imgEl.style.display = 'block';
    phEl.style.display  = 'none';
  } else {
    imgEl.style.display = 'none';
    phEl.style.display  = 'flex';
    phEl.textContent    = catEmoji(it.category);
  }

  // Info
  document.getElementById('detailNameZh').textContent = it.nameZh || '';
  const jaEl = document.getElementById('detailNameJa');
  jaEl.textContent = it.nameJa || '';
  jaEl.style.display = it.nameJa ? '' : 'none';

  document.getElementById('detailLocVal').textContent = it.location || '未指定';
  document.getElementById('detailCatVal').textContent = it.category || '未指定';
  document.getElementById('detailReqVal').textContent = it.requester || '未指定';

  // Status
  updateDetailStatus(it.purchased);

  document.getElementById('detailOverlay').classList.add('open');
}

function updateDetailStatus(purchased) {
  const statusEl = document.getElementById('detailStatusVal');
  const btnEl    = document.getElementById('detailToggleBtn');
  statusEl.textContent = purchased ? '✅ 已購買' : '⬜ 未購買';
  statusEl.style.color = purchased ? '#4ade80' : '#fbbf24';
  btnEl.textContent    = purchased ? '↩️ 改為未購買' : '✅ 標記已購買';
  btnEl.className      = 'detail-btn ' + (purchased ? 'status-bought' : 'status-unbought');
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  detailItemId = null;
}

function detailToggleBought() {
  if (!detailItemId) return;
  const it = items.find(i => i.id === detailItemId);
  if (!it) return;
  const newVal = !it.purchased;
  db.collection('items').doc(detailItemId).update({ purchased: newVal })
    .catch(e => { alert('操作失敗：' + e.message); });
  updateDetailStatus(newVal);
}

function detailEdit() {
  if (!detailItemId) return;
  closeDetail();
  startEdit(detailItemId);
}

function detailDelete() {
  if (!detailItemId) return;
  removeItem(detailItemId);
  closeDetail();
}

// ══════════════════════════════════════
//  Start
// ══════════════════════════════════════
boot();
</script>
</body>
</html>
