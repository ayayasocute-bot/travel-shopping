<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅遊購物清單</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif; background: #0f1117; color: #e4e4e7; }

/* ── Header ── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(135deg, #1e1e2e 0%, #2a2a3c 100%);
  color: white; padding: 12px 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  border-bottom: 1px solid #333348;
}
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.header h1 { font-size: 18px; letter-spacing: 0.5px; }
.user-badge {
  font-size: 13px; background: rgba(255,255,255,0.1);
  padding: 5px 12px; border-radius: 20px; cursor: pointer;
  transition: background 0.2s;
}
.user-badge:hover { background: rgba(255,255,255,0.18); }
.search-wrap { position: relative; }
.search-input {
  width: 100%; padding: 9px 12px 9px 36px;
  border: none; border-radius: 10px;
  background: rgba(255,255,255,0.08); color: #e4e4e7;
  font-size: 14px; outline: none; transition: background 0.2s;
}
.search-input:focus { background: rgba(255,255,255,0.14); }
.search-input::placeholder { color: rgba(255,255,255,0.35); }
.search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; }

/* ── Sort bar ── */
.sort-bar {
  background: #1a1a2e; padding: 10px 12px;
  display: flex; gap: 7px; overflow-x: auto;
  border-bottom: 1px solid #2a2a3c; scrollbar-width: none;
}
.sort-bar::-webkit-scrollbar { display: none; }
.sort-btn {
  white-space: nowrap; padding: 6px 15px;
  border-radius: 20px; border: 1.5px solid #3a3a50;
  background: #1a1a2e; color: #a1a1b5; font-size: 13px; cursor: pointer;
  transition: all 0.2s; font-weight: 500;
}
.sort-btn.active { background: #6366f1; color: white; border-color: #6366f1; }

/* ── Filter bar ── */
.filter-bar {
  background: #1a1a2e; padding: 8px 12px;
  display: flex; gap: 8px; align-items: center;
  border-bottom: 1px solid #2a2a3c; flex-wrap: wrap;
}
.filter-chip {
  padding: 5px 13px; border-radius: 20px;
  border: 1.5px solid #3a3a50; background: #1a1a2e; color: #a1a1b5;
  font-size: 12px; cursor: pointer; transition: all 0.2s; font-weight: 500;
}
.filter-chip.active { background: #ef4444; color: white; border-color: #ef4444; }
.filter-select {
  padding: 5px 10px; border-radius: 20px;
  border: 1.5px solid #3a3a50; background: #1a1a2e; color: #a1a1b5;
  font-size: 12px; cursor: pointer; outline: none;
}

/* ── Form multi-select chips ── */
.form-chips-wrap {
  display: flex; flex-wrap: wrap; gap: 6px;
  padding: 8px 10px; border: 1.5px solid #3a3a50; border-radius: 10px;
  background: #151522; min-height: 42px; cursor: pointer;
  transition: border-color 0.2s;
}
.form-chips-wrap:focus-within { border-color: #6366f1; }
.form-chip-item {
  display: flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 8px;
  background: rgba(99,102,241,0.2); color: #a5b4fc;
  font-size: 12px; font-weight: 600;
}
.form-chip-remove {
  background: none; border: none; color: #a5b4fc; font-size: 11px;
  cursor: pointer; padding: 0 2px; line-height: 1; opacity: 0.7;
}
.form-chip-remove:hover { opacity: 1; }
.form-chips-dropdown {
  margin-top: 6px; background: #1e1e2e; border: 1.5px solid #3a3a50;
  border-radius: 10px; max-height: 180px; overflow-y: auto;
  display: none; padding: 4px 0;
}
.form-chips-dropdown.open { display: block; }
.form-chips-option {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; cursor: pointer; font-size: 13px; color: #c4c4d4;
  transition: background 0.15s;
}
.form-chips-option:hover { background: rgba(99,102,241,0.1); }
.form-chips-check {
  width: 16px; height: 16px; border-radius: 4px;
  border: 1.5px solid #3a3a50; background: #151522;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; flex-shrink: 0;
}
.form-chips-option.selected .form-chips-check {
  background: #6366f1; border-color: #6366f1; color: white;
}

/* ── Stats ── */
.stats-bar {
  background: #151522; padding: 6px 16px;
  font-size: 12px; color: #71717a;
  border-bottom: 1px solid #2a2a3c;
  display: flex; gap: 12px;
}
.stats-bar span { display: flex; align-items: center; gap: 4px; }
.stat-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.stat-dot.green { background: #22c55e; }
.stat-dot.orange { background: #f59e0b; }

/* ── Main ── */
.main { padding: 12px; padding-bottom: 80px; }
.group-header {
  font-size: 12px; font-weight: 700; color: #a78bfa;
  padding: 10px 4px 6px; letter-spacing: 1px;
  text-transform: uppercase;
  border-bottom: 2px solid #6366f1;
  margin-bottom: 10px; margin-top: 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.group-header:first-child { margin-top: 0; }
.group-count {
  font-size: 11px; background: #6366f1; color: white;
  padding: 1px 8px; border-radius: 10px; letter-spacing: 0;
}

/* ── Card grid ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
  gap: 10px; margin-bottom: 4px;
}

/* ── Item card ── */
.item-card {
  background: #1e1e2e; border-radius: 14px; overflow: hidden;
  box-shadow: 0 1px 5px rgba(0,0,0,0.3);
  position: relative; transition: transform 0.2s, box-shadow 0.2s;
  border: 1px solid #2a2a3c;
}
.item-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
.item-card.purchased { opacity: 0.55; }

.card-img-wrap {
  width: 100%; aspect-ratio: 1;
  background: linear-gradient(135deg, #252538 0%, #1e1e2e 100%);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.card-img-placeholder { font-size: 44px; }

.card-body { padding: 9px 10px; }
.card-name-zh { font-size: 13px; font-weight: 700; color: #f0f0f5; margin-bottom: 2px; line-height: 1.35; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; }
.tag {
  font-size: 10px; padding: 2px 7px; border-radius: 9px;
  background: rgba(99,102,241,0.15); color: #a5b4fc; font-weight: 500;
}
.tag.cat { background: rgba(251,146,60,0.15); color: #fdba74; }
.tag.req { background: rgba(34,197,94,0.15); color: #86efac; }
.tag.loc { background: rgba(167,139,250,0.15); color: #c4b5fd; }

.card-footer { display: flex; gap: 5px; }
.btn-status {
  flex: 1; padding: 6px 0; border: none; border-radius: 7px;
  font-size: 11px; cursor: pointer; font-weight: 700;
  transition: all 0.2s;
}
.btn-status.is-purchased { background: rgba(34,197,94,0.2); color: #4ade80; }
.btn-status.not-purchased { background: rgba(245,158,11,0.2); color: #fbbf24; }
.btn-icon {
  padding: 6px 8px; border: 1.5px solid #3a3a50; border-radius: 7px;
  background: #1e1e2e; color: #a1a1b5; font-size: 12px; cursor: pointer; transition: background 0.2s;
}
.btn-icon:hover { background: #2a2a3c; }
.btn-icon.del { border-color: rgba(239,68,68,0.3); color: #f87171; }
.btn-icon.del:hover { background: rgba(239,68,68,0.15); }

.purchased-badge {
  position: absolute; top: 8px; left: 8px;
  background: #22c55e; color: #052e16; font-size: 10px;
  padding: 2px 8px; border-radius: 10px; font-weight: 700;
}

/* ── FAB ── */
.fab {
  position: fixed; bottom: 24px; right: 20px;
  width: 58px; height: 58px; border-radius: 50%;
  background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
  color: white; border: none; font-size: 30px;
  cursor: pointer; box-shadow: 0 4px 16px rgba(99,102,241,0.5);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s, box-shadow 0.2s; z-index: 500;
}
.fab:hover { transform: scale(1.1); box-shadow: 0 6px 22px rgba(99,102,241,0.6); }

/* ── Modal overlay ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: #1e1e2e; border-radius: 22px 22px 0 0;
  width: 100%; max-width: 600px; max-height: 92vh;
  overflow-y: auto; padding: 22px 20px 32px;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  border-top: 1px solid #333348;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-handle {
  width: 40px; height: 4px; background: #3a3a50;
  border-radius: 4px; margin: 0 auto 18px;
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modal-title { font-size: 18px; font-weight: 800; color: #f0f0f5; }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%;
  background: #2a2a3c; border: none; cursor: pointer; color: #a1a1b5;
  font-size: 16px; display: flex; align-items: center; justify-content: center;
}

/* ── Form ── */
.form-group { margin-bottom: 18px; }
.form-label { font-size: 12px; font-weight: 700; color: #71717a; margin-bottom: 6px; display: block; letter-spacing: 0.5px; }
.form-input, .form-select {
  width: 100%; padding: 11px 13px;
  border: 1.5px solid #3a3a50; border-radius: 10px;
  font-size: 14px; outline: none; transition: border-color 0.2s;
  font-family: inherit; background: #151522; color: #e4e4e7;
}
.form-input:focus, .form-select:focus { border-color: #6366f1; }
.form-select option { background: #1e1e2e; color: #e4e4e7; }

.photo-area {
  border: 2px dashed #3a3a50; border-radius: 12px;
  padding: 22px 16px; text-align: center; cursor: pointer;
  transition: border-color 0.2s, background 0.2s; position: relative;
}
.photo-area:hover { border-color: #6366f1; background: #151522; }
.photo-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.photo-placeholder-icon { font-size: 36px; margin-bottom: 6px; }
.photo-hint { font-size: 12px; color: #6b6b80; }

/* ── Photo thumbnails in form ── */
.photo-thumbs {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
}
.photo-thumb {
  position: relative; width: 72px; height: 72px; border-radius: 8px;
  overflow: hidden; border: 1.5px solid #3a3a50;
}
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-thumb-del {
  position: absolute; top: 2px; right: 2px; width: 20px; height: 20px;
  border-radius: 50%; background: rgba(239,68,68,0.85); border: none;
  color: white; font-size: 11px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

.status-row { display: flex; gap: 10px; }
.status-opt {
  flex: 1; padding: 11px; border: 2px solid #3a3a50;
  border-radius: 10px; text-align: center; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: all 0.2s; color: #a1a1b5;
}
.status-opt.sel-purchased { border-color: #22c55e; background: rgba(34,197,94,0.1); color: #4ade80; }
.status-opt.sel-unpurchased { border-color: #f59e0b; background: rgba(245,158,11,0.1); color: #fbbf24; }

.btn-save {
  width: 100%; padding: 15px; background: #6366f1; color: white;
  border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
  cursor: pointer; margin-top: 6px; transition: background 0.2s;
}
.btn-save:hover { background: #4f46e5; }

/* ── Name setup banner ── */
.setup-banner {
  background: linear-gradient(135deg, #312e81 0%, #3730a3 100%);
  padding: 16px; text-align: center;
  border-bottom: 2px solid #6366f1;
}
.setup-banner.hidden { display: none; }
.setup-banner p { font-size: 14px; font-weight: 600; color: #c7d2fe; margin-bottom: 10px; }
.setup-row { display: flex; gap: 8px; max-width: 360px; margin: 0 auto; }
.setup-input {
  flex: 1; padding: 10px 14px; border: 2px solid #6366f1;
  border-radius: 10px; font-size: 15px; text-align: center;
  outline: none; font-family: inherit; background: #1e1e2e; color: #e4e4e7;
}
.setup-input:focus { border-color: #a78bfa; }
.setup-btn {
  padding: 10px 20px; background: #6366f1; color: white;
  border: none; border-radius: 10px; font-size: 15px;
  cursor: pointer; font-weight: 700; white-space: nowrap;
}

/* ── Empty state ── */
.empty-state { text-align: center; padding: 70px 20px; }
.empty-icon { font-size: 64px; margin-bottom: 16px; }
.empty-text { font-size: 15px; color: #71717a; line-height: 1.7; }

/* ── Settings modal ── */
.settings-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 600; opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.settings-overlay.open { opacity: 1; pointer-events: all; }
.settings-panel {
  background: #1e1e2e; border-radius: 22px 22px 0 0;
  width: 100%; max-width: 600px; max-height: 92vh;
  overflow-y: auto; padding: 22px 20px 32px;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  border-top: 1px solid #333348;
}
.settings-overlay.open .settings-panel { transform: translateY(0); }

.opt-section { margin-bottom: 22px; }
.opt-section-title {
  font-size: 13px; font-weight: 700; color: #a78bfa;
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.opt-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.opt-chip {
  display: flex; align-items: center; gap: 3px;
  padding: 6px 8px 6px 8px; border-radius: 10px;
  background: #252538; color: #c4c4d4; font-size: 13px; border: 1.5px solid #3a3a50;
}
.opt-chip-btn {
  width: 20px; height: 20px; border-radius: 50%;
  border: none; font-size: 10px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; line-height: 1;
  background: rgba(99,102,241,0.15); color: #a5b4fc; transition: background 0.2s;
}
.opt-chip-btn:hover { background: rgba(99,102,241,0.35); }
.opt-chip-btn:disabled { opacity: 0.2; cursor: default; }
.opt-chip-btn:disabled:hover { background: rgba(99,102,241,0.15); }
.opt-chip-del {
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(239,68,68,0.2); border: none; color: #f87171;
  font-size: 10px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; line-height: 1;
}
.opt-chip-del:hover { background: #ef4444; color: white; }
.opt-add-row { display: flex; gap: 6px; }
.opt-add-input {
  flex: 1; padding: 7px 12px; border: 1.5px solid #3a3a50;
  border-radius: 8px; font-size: 13px; outline: none; font-family: inherit;
  background: #151522; color: #e4e4e7;
}
.opt-add-input:focus { border-color: #6366f1; }
.opt-add-btn {
  padding: 7px 14px; background: #6366f1; color: white;
  border: none; border-radius: 8px; font-size: 13px;
  cursor: pointer; font-weight: 600; white-space: nowrap;
}
.settings-gear {
  font-size: 13px; background: rgba(255,255,255,0.1);
  padding: 5px 10px; border-radius: 20px; cursor: pointer;
  transition: background 0.2s; border: none; color: white;
}
.settings-gear:hover { background: rgba(255,255,255,0.18); }

/* ── List bar ── */
.list-bar {
  display: flex; gap: 6px; align-items: center;
  margin-top: 8px; flex-wrap: wrap;
}
.list-name-input {
  flex: 1; min-width: 80px; padding: 5px 10px;
  background: rgba(255,255,255,0.08); border: 1.5px solid transparent;
  border-radius: 8px; color: #f0f0f5; font-size: 14px; font-weight: 700;
  font-family: inherit; outline: none; transition: border-color 0.2s;
}
.list-name-input:focus { border-color: #6366f1; background: rgba(255,255,255,0.12); }
.list-bar-btn {
  padding: 5px 10px; border-radius: 8px; border: 1.5px solid #3a3a50;
  background: rgba(255,255,255,0.06); color: #a1a1b5; font-size: 12px;
  cursor: pointer; font-weight: 600; white-space: nowrap; transition: all 0.2s;
  font-family: inherit;
}
.list-bar-btn:hover { background: rgba(255,255,255,0.12); color: #e4e4e7; }
.list-bar-btn.danger { border-color: rgba(239,68,68,0.3); color: #f87171; }
.list-bar-btn.danger:hover { background: rgba(239,68,68,0.15); }
.list-bar-btn.add { border-color: rgba(99,102,241,0.4); color: #a5b4fc; }
.list-bar-btn.add:hover { background: rgba(99,102,241,0.15); }
.list-bar-select {
  padding: 5px 8px; border-radius: 8px; border: 1.5px solid #3a3a50;
  background: #1a1a2e; color: #a1a1b5; font-size: 12px;
  cursor: pointer; outline: none; font-family: inherit;
  max-width: 140px;
}
.list-bar-select option { background: #1e1e2e; color: #e4e4e7; }

/* ── Connection status ── */
.conn-status {
  position: fixed; bottom: 90px; right: 20px;
  font-size: 11px; padding: 5px 12px; border-radius: 20px;
  z-index: 500; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  transition: opacity 0.3s;
}
.conn-status.ok { background: rgba(34,197,94,0.2); color: #4ade80; }
.conn-status.err { background: rgba(239,68,68,0.2); color: #f87171; }
.conn-status.connecting { background: rgba(245,158,11,0.2); color: #fbbf24; }

/* ── Detail modal ── */
.detail-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 350; opacity: 0; pointer-events: none; transition: opacity 0.25s;
  padding: 16px;
}
.detail-overlay.open { opacity: 1; pointer-events: all; }
.detail-card {
  background: #1e1e2e; border-radius: 18px; width: 100%; max-width: 420px;
  max-height: 90vh; overflow-y: auto; border: 1px solid #333348;
  transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.detail-overlay.open .detail-card { transform: scale(1); }
.detail-img-wrap {
  width: 100%; aspect-ratio: 1; background: linear-gradient(135deg, #252538 0%, #1e1e2e 100%);
  overflow: hidden; border-radius: 18px 18px 0 0; position: relative;
}
.detail-img-placeholder {
  font-size: 80px; width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
}

/* ── Detail image slider ── */
.detail-slider {
  display: flex; width: 100%; height: 100%;
  overflow-x: auto; scroll-snap-type: x mandatory;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.detail-slider::-webkit-scrollbar { display: none; }
.detail-slide {
  flex: 0 0 100%; width: 100%; height: 100%;
  scroll-snap-align: start;
  display: flex; align-items: center; justify-content: center;
}
.detail-slide img { width: 100%; height: 100%; object-fit: contain; background: #151522; }
.detail-dots {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px; z-index: 2;
}
.detail-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: rgba(255,255,255,0.35); transition: background 0.2s;
}
.detail-dot.active { background: white; }
.detail-nav-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(0,0,0,0.5); border: none; color: white;
  font-size: 16px; cursor: pointer; z-index: 2;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.detail-nav-btn.prev { left: 8px; }
.detail-nav-btn.next { right: 48px; }

/* ── Detail URL row ── */
.detail-link {
  color: #818cf8; text-decoration: none; word-break: break-all;
}
.detail-link:hover { text-decoration: underline; }
.detail-note { color: #c4c4d4; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
.detail-close {
  position: absolute; top: 12px; right: 12px;
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(0,0,0,0.6); border: none; color: white;
  font-size: 18px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.detail-body { padding: 16px 18px 20px; }

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
// ══════════════════════════════════════
//  ★ Firebase 設定 — 請填入你的 Firebase 專案資訊 ★
// ══════════════════════════════════════
const firebaseConfig = {
  apiKey:            "AIzaSyCJRIqX4hOK61DZA0dXgTNY20oWgOY8Xso",
  authDomain:        "travel-shopping.firebaseapp.com",
  projectId:         "travel-shopping",
  storageBucket:     "travel-shopping.firebasestorage.app",
  messagingSenderId: "857496641318",
  appId:             "1:857496641318:web:afb1db0feccfacb3ff2be7"
};
// ══════════════════════════════════════

// Init Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 啟用離線快取（刷新頁面也能保留資料）
db.enablePersistence({ synchronizeTabs: true }).catch(err => {
  console.warn('Firestore persistence error:', err.code);
});

// ══════════════════════════════════════
//  State
// ══════════════════════════════════════
let items        = [];
let currentUser  = localStorage.getItem('travel_user') || '';
let sortMode     = 'all';
let onlyUnsold   = false;
let editingId    = null;
let formPhotos   = [];
let formBought   = false;
const formChips  = { location: [], category: [], requester: [] };

// Multi-list state
let lists          = [];
let currentListId  = localStorage.getItem('travel_currentList') || '';
let itemsUnsub     = null;
let optionsUnsub   = null;

const DEFAULT_OPTIONS = {
  locations:  ['松本清','唐吉訶德','成田機場','羽田機場','藥妝店','便利商店','百貨公司','超市'],
  categories: ['藥妝','零食','伴手禮','電器','服飾','保養品','文具'],
  requesters: []
};
let dropdownOptions = JSON.parse(JSON.stringify(DEFAULT_OPTIONS));

// ══════════════════════════════════════
//  Boot — 啟動即時監聽
// ══════════════════════════════════════
function boot() {
  if (!currentUser) {
    document.getElementById('setupBanner').classList.remove('hidden');
    document.getElementById('userLabel').textContent = '未設定';
  } else {
    document.getElementById('setupBanner').classList.add('hidden');
    document.getElementById('userLabel').textContent = currentUser;
  }

  // 監聽清單集合
  db.collection('lists').orderBy('createdAt', 'asc').onSnapshot(async snapshot => {
    lists = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

    if (lists.length === 0) {
      // 首次使用或遷移：建立預設清單
      const ref = await db.collection('lists').add({ name: '日本旅遊', createdAt: new Date().toISOString() });
      // 遷移舊有項目（沒有 listId 的）
      const oldItems = await db.collection('items').get();
      const batch = db.batch();
      oldItems.docs.forEach(doc => {
        if (!doc.data().listId) {
          batch.update(doc.ref, { listId: ref.id });
        }
      });
      // 遷移舊設定
      const oldOpts = await db.doc('settings/options').get();
      if (oldOpts.exists) {
        batch.set(db.doc('settings/' + ref.id), oldOpts.data());
      }
      await batch.commit();
      currentListId = ref.id;
      localStorage.setItem('travel_currentList', currentListId);
      return; // onSnapshot 會再次觸發
    }

    // 確保 currentListId 有效
    if (!currentListId || !lists.find(l => l.id === currentListId)) {
      currentListId = lists[0].id;
      localStorage.setItem('travel_currentList', currentListId);
    }

    updateListBar();
    attachListListeners();
  });

  populateFormDropdowns();
  render();
}

function updateListBar() {
  const sel = document.getElementById('listSelect');
  sel.innerHTML = lists.map(l =>
    `<option value="${l.id}"${l.id === currentListId ? ' selected' : ''}>${esc(l.name)}</option>`
  ).join('');
  const cur = lists.find(l => l.id === currentListId);
  document.getElementById('listNameInput').value = cur ? cur.name : '';
}

function attachListListeners() {
  // 取消舊的監聽
  if (itemsUnsub) itemsUnsub();
  if (optionsUnsub) optionsUnsub();

  const statusEl = document.getElementById('connStatus');

  // 即時監聽當前清單的購物項目
  itemsUnsub = db.collection('items')
    .where('listId', '==', currentListId)
    .onSnapshot(snapshot => {
      items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      items.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
      statusEl.textContent = '✅ 已連線（' + items.length + ' 項）';
      statusEl.className = 'conn-status ok';
      setTimeout(() => { statusEl.style.opacity = '0'; }, 3000);
      refreshGroupFilters();
      render();
    }, err => {
      console.error('Firestore items error:', err.code, err.message);
      statusEl.textContent = '❌ 連線失敗：' + err.code;
      statusEl.className = 'conn-status err';
      statusEl.style.opacity = '1';
    });

  // 即時監聯當前清單的選單選項
  optionsUnsub = db.doc('settings/' + currentListId).onSnapshot(doc => {
    if (doc.exists) {
      dropdownOptions = doc.data();
    } else {
      db.doc('settings/' + currentListId).set(DEFAULT_OPTIONS);
      dropdownOptions = JSON.parse(JSON.stringify(DEFAULT_OPTIONS));
    }
    populateFormDropdowns();
    if (document.getElementById('settingsOverlay').classList.contains('open')) {
      renderOptionLists();
    }
  }, err => {
    console.error('Firestore options error:', err.code, err.message);
  });
}

// ══════════════════════════════════════
//  User name (localStorage — 各裝置獨立)
// ══════════════════════════════════════
function confirmName() {
  const v = document.getElementById('nameInput').value.trim();
  if (!v) { document.getElementById('nameInput').focus(); return; }
  currentUser = v;
  localStorage.setItem('travel_user', v);
  document.getElementById('userLabel').textContent = v;
  document.getElementById('setupBanner').classList.add('hidden');
  render();
}

function promptChangeName() {
  const v = prompt('更改您的名字：', currentUser);
  if (v && v.trim()) {
    currentUser = v.trim();
    localStorage.setItem('travel_user', currentUser);
    document.getElementById('userLabel').textContent = currentUser;
    render();
  }
}

document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmName();
});

// ══════════════════════════════════════
//  Sort & Filter
// ══════════════════════════════════════
function setSort(mode) {
  sortMode = mode;
  document.querySelectorAll('.sort-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.sort === mode)
  );
  // 按「全部」時清除所有篩選條件
  if (mode === 'all') {
    document.getElementById('selLocation').value  = '';
    document.getElementById('selCategory').value  = '';
    document.getElementById('selRequester').value = '';
    onlyUnsold = false;
    document.getElementById('chipUnpurchased').classList.remove('active');
    document.getElementById('searchInput').value = '';
  }
  document.getElementById('selLocation').style.display  = (mode === 'location')  ? '' : 'none';
  document.getElementById('selCategory').style.display  = (mode === 'category')  ? '' : 'none';
  document.getElementById('selRequester').style.display = (mode === 'requester') ? '' : 'none';
  refreshGroupFilters();
  render();
}

function toggleUnpurchased() {
  onlyUnsold = !onlyUnsold;
  document.getElementById('chipUnpurchased').classList.toggle('active', onlyUnsold);
  render();
}

function refreshGroupFilters() {
  populateFilterSelect('selLocation',  'location',  '📍 所有地點');
  populateFilterSelect('selCategory',  'category',  '🏷️ 所有性質');
  populateFilterSelect('selRequester', 'requester', '👤 所有需求者');
}

function populateFilterSelect(selId, field, allLabel) {
  const sel  = document.getElementById(selId);
  const prev = sel.value;
  const vals = [...new Set(items.flatMap(i => {
    const v = i[field];
    return Array.isArray(v) ? v : (v ? [v] : []);
  }))].sort((a, b) => a.localeCompare(b, 'zh'));
  sel.innerHTML = `<option value="">${allLabel}</option>`;
  vals.forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    if (v === prev) o.selected = true;
    sel.appendChild(o);
  });
}

function filteredItems() {
  const q      = document.getElementById('searchInput').value.toLowerCase();
  const locFil = document.getElementById('selLocation').value;
  const catFil = document.getElementById('selCategory').value;
  const reqFil = document.getElementById('selRequester').value;
  return items.filter(it => {
    if (onlyUnsold && it.purchased) return false;
    if (locFil) {
      const v = it.location;
      if (Array.isArray(v) ? !v.includes(locFil) : v !== locFil) return false;
    }
    if (catFil) {
      const v = it.category;
      if (Array.isArray(v) ? !v.includes(catFil) : v !== catFil) return false;
    }
    if (reqFil) {
      const v = it.requester;
      if (Array.isArray(v) ? !v.includes(reqFil) : v !== reqFil) return false;
    }
    if (sortMode === 'mine') {
      const v = it.requester;
      const match = Array.isArray(v) ? v.includes(currentUser) : v === currentUser;
      if (!match) return false;
    }
    if (q) {
      if (!(it.nameZh || '').toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

// ══════════════════════════════════════
//  Render
// ══════════════════════════════════════
function render() {
  const list  = filteredItems();
  const total = items.length;
  const done  = items.filter(i => i.purchased).length;

  document.getElementById('statsBar').innerHTML =
    `<span><span class="stat-dot green"></span>已購買 ${done}</span>
     <span><span class="stat-dot orange"></span>未購買 ${total - done}</span>
     <span>共 ${total} 項</span>`;

  const main = document.getElementById('main');

  if (list.length === 0) {
    main.innerHTML = `<div class="empty-state">
      <div class="empty-icon">${total === 0 ? '🛒' : '🔍'}</div>
      <div class="empty-text">${total === 0
        ? '清單是空的<br>點右下角「＋」新增第一項！'
        : '找不到符合條件的商品'}</div>
    </div>`;
    return;
  }

  if (sortMode === 'all' || sortMode === 'mine') {
    main.innerHTML = `<div class="card-grid">${list.map(cardHTML).join('')}</div>`;
    return;
  }

  const key = { location: 'location', category: 'category', requester: 'requester' }[sortMode];
  const icon = { location: '📍', category: '🏷️', requester: '👤' }[sortMode];
  const groups = {};
  list.forEach(it => {
    const vals = toArr(it[key]);
    if (vals.length === 0) vals.push('未分類');
    vals.forEach(g => { (groups[g] = groups[g] || []).push(it); });
  });

  main.innerHTML = Object.entries(groups)
    .sort(([a], [b]) => a.localeCompare(b, 'zh'))
    .map(([g, gItems]) => `
      <div class="group-header">
        <span>${icon} ${esc(g)}</span>
        <span class="group-count">${gItems.length} 項</span>
      </div>
      <div class="card-grid">${gItems.map(cardHTML).join('')}</div>
    `).join('');
}

function getFirstPhoto(it) {
  if (it.photos && it.photos.length) return it.photos[0];
  if (it.photo) return it.photo;
  return null;
}

function cardHTML(it) {
  const firstImg = getFirstPhoto(it);
  const img = firstImg
    ? `<img src="${firstImg}" alt="${esc(it.nameZh)}" onerror="this.style.display='none'">`
    : `<div class="card-img-placeholder">${catEmoji(it.category)}</div>`;

  return `
    <div class="item-card${it.purchased ? ' purchased' : ''}" id="card-${it.id}">
      ${it.purchased ? '<div class="purchased-badge">✓ 已購買</div>' : ''}
      <div class="card-img-wrap" onclick="openDetail('${it.id}')" style="cursor:pointer">${img}</div>
      <div class="card-body">
        <div class="card-name-zh" onclick="openDetail('${it.id}')" style="cursor:pointer">${esc(it.nameZh)}</div>
        <div class="card-tags">
          ${tagsHTML(it.location,  'loc', '📍')}
          ${tagsHTML(it.category,  'cat', '🏷️')}
          ${tagsHTML(it.requester, 'req', '👤')}
        </div>
        <div class="card-footer">
          <button class="btn-status ${it.purchased ? 'is-purchased' : 'not-purchased'}"
            onclick="toggleBought('${it.id}')">
            ${it.purchased ? '✅ 已購買' : '⬜ 標記購買'}
          </button>
          <button class="btn-icon" onclick="startEdit('${it.id}')" title="編輯">✏️</button>
          <button class="btn-icon del" onclick="removeItem('${it.id}')" title="刪除">🗑️</button>
        </div>
      </div>
    </div>`;
}

function tagsHTML(val, cls, icon) {
  if (!val) return '';
  const arr = Array.isArray(val) ? val : [val];
  return arr.filter(Boolean).map(v => `<span class="tag ${cls}">${icon} ${esc(v)}</span>`).join('');
}

function catEmoji(cat) {
  const c = Array.isArray(cat) ? cat[0] : cat;
  return { '藥妝':'💊','零食':'🍬','伴手禮':'🎁','電器':'⚡','服飾':'👗',
           '保養品':'🧴','文具':'✏️' }[c] || '🛍️';
}

function esc(s) {
  if (Array.isArray(s)) s = s.join('、');
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
                .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════════
//  CRUD → Firestore
// ══════════════════════════════════════
function showConnStatus(msg, type) {
  const el = document.getElementById('connStatus');
  el.textContent = msg;
  el.className = 'conn-status ' + type;
  el.style.opacity = '1';
  if (type === 'ok') setTimeout(() => { el.style.opacity = '0'; }, 3000);
}

function toggleBought(id) {
  const it = items.find(i => i.id === id);
  if (it) {
    db.collection('items').doc(id).update({ purchased: !it.purchased })
      .catch(e => { alert('操作失敗：' + e.message); showConnStatus('❌ ' + e.code, 'err'); });
  }
}

function removeItem(id) {
  if (!confirm('確定刪除這個項目嗎？')) return;
  db.collection('items').doc(id).delete()
    .catch(e => { alert('刪除失敗：' + e.message); showConnStatus('❌ ' + e.code, 'err'); });
}

function saveItem() {
  const nameZh = document.getElementById('fNameZh').value.trim();
  if (!nameZh) { alert('請填寫中文名稱！'); document.getElementById('fNameZh').focus(); return; }

  const data = {
    nameZh,
    location:   formChips.location.length   ? [...formChips.location]  : [],
    category:   formChips.category.length   ? [...formChips.category]  : [],
    requester:  formChips.requester.length  ? [...formChips.requester] : [currentUser],
    purchased:  formBought,
    photos:     [...formPhotos],
    photo:      formPhotos.length ? formPhotos[0] : null,
    url:        document.getElementById('fUrl').value.trim() || '',
    note:       document.getElementById('fNote').value.trim() || '',
  };

  let op;
  if (editingId) {
    op = db.collection('items').doc(editingId).update(data);
  } else {
    data.createdAt = new Date().toISOString();
    data.listId = currentListId;
    op = db.collection('items').add(data);
  }

  op.then(() => {
    showConnStatus('✅ 已儲存', 'ok');
  }).catch(e => {
    alert('儲存失敗：' + e.message);
    showConnStatus('❌ ' + e.code, 'err');
  });

  closeModal();
}

function copyToList() {
  if (!editingId) return;
  const it = items.find(i => i.id === editingId);
  if (!it) return;
  const targetId = document.getElementById('copyTargetList').value;
  if (!targetId) return;
  const targetList = lists.find(l => l.id === targetId);

  const copy = {
    nameZh:    it.nameZh    || '',
    location:  toArr(it.location),
    category:  toArr(it.category),
    requester: toArr(it.requester),
    purchased: false,
    photos:    it.photos    || (it.photo ? [it.photo] : []),
    photo:     it.photo     || null,
    url:       it.url       || '',
    note:      it.note      || '',
    listId:    targetId,
    createdAt: new Date().toISOString()
  };

  db.collection('items').add(copy).then(() => {
    showConnStatus('📋 已複製到「' + (targetList ? targetList.name : '') + '」', 'ok');
  }).catch(e => {
    alert('複製失敗：' + e.message);
    showConnStatus('❌ ' + e.code, 'err');
  });

  closeModal();
}

//  Modal helpers
// ══════════════════════════════════════
function openAddModal() {
  if (!currentUser) {
    document.getElementById('nameInput').focus();
    document.getElementById('setupBanner').style.animation = 'flash 0.5s';
    setTimeout(() => document.getElementById('setupBanner').style.animation = '', 600);
    return;
  }
  editingId  = null;
  formPhotos = [];
  formBought = false;

  document.getElementById('fUrl').value    = '';

  formChips.category  = [];
  formChips.requester = [];

function resetCustomInputs() {
  ['fLocationCustom','fCategoryCustom','fRequesterCustom'].forEach(id => {
    document.getElementById(id).style.display = 'none';
    document.getElementById(id).value = '';
  });
}

function startEdit(id) {
  const it = items.find(i => i.id === id);
  if (!it) return;
  editingId  = id;
  formPhotos = it.photos ? [...it.photos] : (it.photo ? [it.photo] : []);
  formBought = it.purchased || false;

  document.getElementById('modalTitle').textContent    = '編輯購物項目';
  document.getElementById('fNameZh').value  = it.nameZh  || '';
  document.getElementById('fUrl').value    = it.url     || '';
  document.getElementById('fNote').value   = it.note    || '';
  // 載入多選值
  formChips.location  = toArr(it.location);
  formChips.category  = toArr(it.category);
  formChips.requester = toArr(it.requester);
  renderFormChips();
  resetCustomInputs();
  renderPhotoThumbs();
  document.getElementById('photoPlaceholder').style.display = formPhotos.length ? 'none' : 'block';
  document.getElementById('photoInput').value = '';
  setFormStatus(it.purchased);

  // 複製到其他清單（僅編輯模式且有多個清單時顯示）
  const copyGroup = document.getElementById('copyToListGroup');
  const otherLists = lists.filter(l => l.id !== currentListId);
  if (otherLists.length > 0) {
    const sel = document.getElementById('copyTargetList');
    sel.innerHTML = otherLists.map(l =>
      `<option value="${l.id}">${esc(l.name)}</option>`
    ).join('');
    copyGroup.style.display = '';
  } else {
    copyGroup.style.display = 'none';
  }

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

// ══════════════════════════════════════
//  Form multi-select (chips)
// ══════════════════════════════════════
function toArr(v) {
  if (Array.isArray(v)) return [...v];
  return v ? [v] : [];
}

function displayVal(v) {
  if (Array.isArray(v) && v.length) return v.join('、');
  return v || '未指定';
}

const chipFieldMap = {
  location:  { chips: 'fLocationChips',  ph: 'fLocationPlaceholder',  drop: 'fLocationDrop',  custom: 'fLocationCustom',  optKey: 'locations' },
  category:  { chips: 'fCategoryChips',  ph: 'fCategoryPlaceholder',  drop: 'fCategoryDrop',  custom: 'fCategoryCustom',  optKey: 'categories' },
  requester: { chips: 'fRequesterChips', ph: 'fRequesterPlaceholder', drop: 'fRequesterDrop', custom: 'fRequesterCustom', optKey: 'requesters' }
};

function renderFormChips() {
  for (const [field, cfg] of Object.entries(chipFieldMap)) {
    const arr = formChips[field];
    const chipsEl = document.getElementById(cfg.chips);
    const phEl    = document.getElementById(cfg.ph);

    if (arr.length === 0) {
      chipsEl.innerHTML = '';
      phEl.style.display = '';
    } else {
      chipsEl.innerHTML = arr.map((v, i) =>
        `<span class="form-chip-item">${esc(v)}<button class="form-chip-remove" onclick="event.stopPropagation();removeFormChip('${field}',${i})">✕</button></span>`
      ).join('');
      phEl.style.display = 'none';
    }

    // 更新下拉選單勾選狀態
    renderFormDropdown(field);
  }
}

function renderFormDropdown(field) {
  const cfg = chipFieldMap[field];
  const opts = dropdownOptions[cfg.optKey] || [];
  const sel = formChips[field];
  const dropEl = document.getElementById(cfg.drop);

  dropEl.innerHTML = opts.map(v =>
    `<div class="form-chips-option${sel.includes(v) ? ' selected' : ''}"
         onclick="event.stopPropagation();toggleFormChip('${field}',this)" data-value="${esc(v)}">
      <span class="form-chips-check">${sel.includes(v) ? '✓' : ''}</span>
      <span>${esc(v)}</span>
    </div>`
  ).join('')
  + `<div class="form-chips-option" onclick="event.stopPropagation();showCustomChipInput('${field}')" style="color:#71717a">
      ✏️ 其他(請自行輸入…)
    </div>`;
}

function toggleFormDrop(dropId) {
  const drop = document.getElementById(dropId);
  // 關閉其他
  document.querySelectorAll('.form-chips-dropdown.open').forEach(d => {
    if (d.id !== dropId) d.classList.remove('open');
  });
  drop.classList.toggle('open');
}

function toggleFormChip(field, el) {
  const v = el.dataset.value;
  const idx = formChips[field].indexOf(v);
  if (idx >= 0) {
    formChips[field].splice(idx, 1);
  } else {
    formChips[field].push(v);
  }
  renderFormChips();
}

function removeFormChip(field, idx) {
  formChips[field].splice(idx, 1);
  renderFormChips();
}

function showCustomChipInput(field) {
  const cfg = chipFieldMap[field];
  const inp = document.getElementById(cfg.custom);
  inp.style.display = '';
  inp.focus();
  document.getElementById(cfg.drop).classList.remove('open');
}

function addCustomChip(field) {
  const cfg = chipFieldMap[field];
  const inp = document.getElementById(cfg.custom);
  const v = inp.value.trim();
  if (!v) return;
  if (!formChips[field].includes(v)) {
    formChips[field].push(v);
  }
  inp.value = '';
  inp.style.display = 'none';
  renderFormChips();
}

// 點擊表單外部關閉下拉
document.addEventListener('click', e => {
  if (!e.target.closest('.form-chips-wrap') && !e.target.closest('.form-chips-dropdown')) {
    document.querySelectorAll('.form-chips-dropdown.open').forEach(d => d.classList.remove('open'));
  }
});

// ══════════════════════════════════════
//  Photo upload (多張，壓縮至 600px)
// ══════════════════════════════════════
function onPhotoChange(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  files.forEach(file => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 600;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else        { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      formPhotos.push(canvas.toDataURL('image/jpeg', 0.6));
      URL.revokeObjectURL(url);
      renderPhotoThumbs();
      document.getElementById('photoPlaceholder').style.display = 'none';
    };
    img.src = url;
  });
  e.target.value = '';
}

function renderPhotoThumbs() {
  const el = document.getElementById('photoThumbs');
  el.innerHTML = formPhotos.map((src, i) =>
    `<div class="photo-thumb">
      <img src="${src}" alt="照片${i+1}">
      <button class="photo-thumb-del" onclick="removePhoto(${i})">✕</button>
    </div>`
  ).join('');
  if (formPhotos.length === 0) {
    document.getElementById('photoPlaceholder').style.display = 'block';
  }
}

function removePhoto(idx) {
  formPhotos.splice(idx, 1);
  renderPhotoThumbs();
}

// ══════════════════════════════════════
//  Status toggle
// ══════════════════════════════════════
function setFormStatus(bought) {
  formBought = bought;
  document.getElementById('optPurchased').className   = 'status-opt' + (bought  ? ' sel-purchased'   : '');
  document.getElementById('optUnpurchased').className = 'status-opt' + (!bought ? ' sel-unpurchased' : '');
}

// ══════════════════════════════════════
//  Settings & Dropdown Options → Firestore
// ══════════════════════════════════════
function openSettings() {
  renderOptionLists();
  document.getElementById('settingsOverlay').classList.add('open');
}
function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('open');
}

function renderOptionLists() {
  const map = {
    locations:  'optListLocation',
    categories: 'optListCategory',
    requesters: 'optListRequester'
  };
  for (const [key, elId] of Object.entries(map)) {
    const arr = dropdownOptions[key] || [];
    const el = document.getElementById(elId);
    el.innerHTML = arr.map((v, i) =>
      `<div class="opt-chip">` +
        `<button class="opt-chip-btn" onclick="moveOption('${key}',${i},-1)" title="上移"${i === 0 ? ' disabled' : ''}>▲</button>` +
        `<button class="opt-chip-btn" onclick="moveOption('${key}',${i},1)" title="下移"${i === arr.length - 1 ? ' disabled' : ''}>▼</button>` +
        `<span style="margin:0 4px">${esc(v)}</span>` +
        `<button class="opt-chip-del" onclick="removeOption('${key}',${i})" title="刪除">✕</button>` +
      `</div>`
    ).join('') || '<span style="font-size:12px;color:#71717a">尚未新增</span>';
  }
}

function moveOption(key, idx, dir) {
  const arr = dropdownOptions[key];
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= arr.length) return;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
  db.doc('settings/' + currentListId).set(dropdownOptions);
  renderOptionLists();
  populateFormDropdowns();
}

function addOption(key) {
  const inputMap = { locations: 'optInputLocation', categories: 'optInputCategory', requesters: 'optInputRequester' };
  const input = document.getElementById(inputMap[key]);
  const v = input.value.trim();
  if (!v) return;
  if ((dropdownOptions[key] || []).includes(v)) { input.value = ''; return; }
  dropdownOptions[key] = [...(dropdownOptions[key] || []), v];
  db.doc('settings/' + currentListId).set(dropdownOptions);
  input.value = '';
  renderOptionLists();
  populateFormDropdowns();
}

function removeOption(key, idx) {
  dropdownOptions[key].splice(idx, 1);
  db.doc('settings/' + currentListId).set(dropdownOptions);
  renderOptionLists();
  populateFormDropdowns();
}

function populateFormDropdowns() {
  // 多選模式下只需要更新 chips dropdown
  renderFormChips();
}

// ══════════════════════════════════════
//  Detail view (放大檢視)
// ══════════════════════════════════════
let detailItemId = null;

let detailPhotos = [];
let detailSlideIdx = 0;

function openDetail(id) {
  const it = items.find(i => i.id === id);
  if (!it) return;
  detailItemId = id;

  // Photos — slider
  detailPhotos = it.photos && it.photos.length ? [...it.photos] : (it.photo ? [it.photo] : []);
  const slider = document.getElementById('detailSlider');
  const phEl   = document.getElementById('detailImgPlaceholder');
  const dotsEl = document.getElementById('detailDots');
  const prevBtn = document.getElementById('detailPrev');
  const nextBtn = document.getElementById('detailNext');

  if (detailPhotos.length > 0) {
    slider.innerHTML = detailPhotos.map((src, i) =>
      `<div class="detail-slide"><img src="${src}" alt="照片${i+1}"></div>`
    ).join('');
    slider.style.display = 'flex';
    phEl.style.display = 'none';
    detailSlideIdx = 0;

    if (detailPhotos.length > 1) {
      dotsEl.innerHTML = detailPhotos.map((_, i) =>
        `<span class="detail-dot${i === 0 ? ' active' : ''}"></span>`
      ).join('');
      dotsEl.style.display = 'flex';
      prevBtn.style.display = '';
      nextBtn.style.display = '';
      // 監聽 scroll 更新 dots
      slider.onscroll = () => {
        const idx = Math.round(slider.scrollLeft / slider.offsetWidth);
        if (idx !== detailSlideIdx) {
          detailSlideIdx = idx;
          dotsEl.querySelectorAll('.detail-dot').forEach((d, i) =>
            d.classList.toggle('active', i === idx)
          );
        }
      };
    } else {
      dotsEl.style.display = 'none';
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
    }
  } else {
    slider.innerHTML = '';
    slider.style.display = 'none';
    phEl.style.display = 'flex';
    phEl.textContent = catEmoji(it.category);
    dotsEl.style.display = 'none';
    prevBtn.style.display = 'none';
    nextBtn.style.display = 'none';
  }

  // Info
  document.getElementById('detailNameZh').textContent = it.nameZh || '';

  document.getElementById('detailLocVal').textContent = displayVal(it.location);
  document.getElementById('detailCatVal').textContent = displayVal(it.category);
  document.getElementById('detailReqVal').textContent = displayVal(it.requester);

  // URL
  const urlRow = document.getElementById('detailUrlRow');
  const urlVal = document.getElementById('detailUrlVal');
  if (it.url) {
    urlVal.innerHTML = `<a class="detail-link" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.url)}</a>`;
    urlRow.style.display = '';
  } else {
    urlRow.style.display = 'none';
  }

  // Note
  const noteRow = document.getElementById('detailNoteRow');
  const noteVal = document.getElementById('detailNoteVal');
  if (it.note) {
    noteVal.textContent = it.note;
    noteRow.style.display = '';
  } else {
    noteRow.style.display = 'none';
  }

  // Status
  updateDetailStatus(it.purchased);

  document.getElementById('detailOverlay').classList.add('open');
}

function slideDetail(dir) {
  const slider = document.getElementById('detailSlider');
  const newIdx = Math.max(0, Math.min(detailPhotos.length - 1, detailSlideIdx + dir));
  slider.scrollTo({ left: newIdx * slider.offsetWidth, behavior: 'smooth' });
}

function updateDetailStatus(purchased) {
  const statusEl = document.getElementById('detailStatusVal');
  const btnEl    = document.getElementById('detailToggleBtn');
  statusEl.textContent = purchased ? '✅ 已購買' : '⬜ 未購買';
  statusEl.style.color = purchased ? '#4ade80' : '#fbbf24';
  btnEl.textContent    = purchased ? '↩️ 改為未購買' : '✅ 標記已購買';
  btnEl.className      = 'detail-btn ' + (purchased ? 'status-bought' : 'status-unbought');
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  detailItemId = null;
}

function detailToggleBought() {
  if (!detailItemId) return;
  const it = items.find(i => i.id === detailItemId);
  if (!it) return;
  const newVal = !it.purchased;
  db.collection('items').doc(detailItemId).update({ purchased: newVal })
    .catch(e => { alert('操作失敗：' + e.message); });
  updateDetailStatus(newVal);
}

function detailEdit() {
  if (!detailItemId) return;
  const id = detailItemId;
  closeDetail();
  setTimeout(() => startEdit(id), 300);
}

// ══════════════════════════════════════
//  Multi-list CRUD
// ══════════════════════════════════════
async function createList() {
  const name = prompt('請輸入新清單名稱：');
  if (!name || !name.trim()) return;
  const ref = await db.collection('lists').add({ name: name.trim(), createdAt: new Date().toISOString() });
  currentListId = ref.id;
  localStorage.setItem('travel_currentList', currentListId);
  // 新清單會用預設選項
  db.doc('settings/' + ref.id).set(JSON.parse(JSON.stringify(DEFAULT_OPTIONS)));
  showConnStatus('✅ 已新增清單', 'ok');
}

async function deleteList() {
  if (lists.length <= 1) { alert('至少需保留一個清單！'); return; }
  const cur = lists.find(l => l.id === currentListId);
  if (!confirm('確定刪除「' + (cur ? cur.name : '') + '」及其所有項目嗎？此操作無法復原。')) return;

  // 刪除該清單的所有項目
  const snap = await db.collection('items').where('listId', '==', currentListId).get();
  const batch = db.batch();
  snap.docs.forEach(doc => batch.delete(doc.ref));
  batch.delete(db.doc('settings/' + currentListId));
  batch.delete(db.collection('lists').doc(currentListId));
  await batch.commit();

  // 切換到其他清單
  currentListId = lists.find(l => l.id !== currentListId).id;
  localStorage.setItem('travel_currentList', currentListId);
  showConnStatus('🗑️ 清單已刪除', 'ok');
}

function switchList(listId) {
  if (listId === currentListId) return;
  currentListId = listId;
  localStorage.setItem('travel_currentList', currentListId);
  updateListBar();
  attachListListeners();
}

function renameList() {
  const input = document.getElementById('listNameInput');
  const newName = input.value.trim();
  if (!newName) {
    const cur = lists.find(l => l.id === currentListId);
    input.value = cur ? cur.name : '';
    return;
  }
  const cur = lists.find(l => l.id === currentListId);
  if (cur && cur.name !== newName) {
    db.collection('lists').doc(currentListId).update({ name: newName });
  }
}

// ══════════════════════════════════════
//  Start
// ══════════════════════════════════════
boot();
</script>
